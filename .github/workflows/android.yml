name: Build Kadaya Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.1"
          use-dotnet: false
          include-templates: true
      - name: Import project
        run: godot --headless --editor --quit
      - name: Build Android APK
        run: |
          mkdir -p export
          godot --headless --path . --export-debug "Android" export/Kadaya-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kadaya-Android-debug
          path: export/Kadaya-debug.apk
